name: Deploy site

# Pages source is set to "GitHub Actions", so this workflow is the ONLY thing that
# can publish the site. Its first successful run replaces the currently-live build.
on:
  push:
    branches: [main]
  # Without this the harness only ran AFTER a merge landed on main, so it could not
  # block anything -- `gh pr checks` reported no checks at all on PR #3. The whole
  # premise of verify-site.mjs is that a green build is not sufficient evidence; that
  # is worth nothing if it reports after the fact.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Types were documentation-only until this step existed: astro build strips
      # types without checking them, so every interface was enforced by nothing.
      - run: npm run check

      - run: npm run build

      # Gate the deploy on the site checks, not just a green build: the
      # diagram-scoping failure mode produces a passing build with unstyled
      # diagrams, and the client-name check must never regress.
      - run: npm run verify

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Build+verify run on every PR; publishing stays main-only.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
